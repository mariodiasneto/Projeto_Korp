server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://http-server-projeto-korp:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicit proxy for /projeto-korp endpoint
    location /projeto-korp {
        proxy_pass http://http-server-projeto-korp:8080/projeto-korp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for metrics endpoint if accessed via Nginx
    location /metrics {
        proxy_pass http://http-server-projeto-korp:8080/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
